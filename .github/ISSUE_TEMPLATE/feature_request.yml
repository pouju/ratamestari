name: Feature request
description: An idea for Ratamestari
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the course-setting task or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Ratamestari help?
  - type: textarea
    id: context
    attributes:
      label: Rules or practice behind it
      description: Rule references or how course setters usually handle this, if you know.
