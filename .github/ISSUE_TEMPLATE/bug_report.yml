name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach club maps (OCAD files or screenshots of them) without the club's permission. A description of the area is usually enough.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the sample map
        2. Ask for a long distance course for H21
        3. …
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the footer, for example 0.1.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 140 on Windows, Safari on iPhone…
  - type: input
    id: map
    attributes:
      label: Map
      description: The sample map, or the OCAD version and map type (forest, sprint…) of your own map
  - type: textarea
    id: rule
    attributes:
      label: Rule involved
      description: If the course breaks a rule, which one? For example IOF Appendix 2 §3.4 or Lajisäännöt §11.25.
